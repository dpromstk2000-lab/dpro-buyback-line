name: DPRO CHAT B R2 BUYBACK Public Guide Safety

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Repository guard
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "dpromstk2000-lab/dpro-buyback-line"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal R2 fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('guide-center.html'); s=p.read_text(encoding='utf-8')
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('expected copy not found: '+a[:110])
              s=s.replace(a,b)
          repls=[
          ('<title>DPRO BUYBACK｜Guide Center</title>','<title>DPRO BUYBACK｜操作ガイド</title>'),
          ('<div class="kicker">DPRO TUTORIAL STANDARD V1.1 / GUIDE CENTER</div>','<div class="kicker">DPRO BUYBACK / 操作ガイド</div>'),
          ('<h1 id="pageTitle">BUYBACK Guide Center</h1>','<h1 id="pageTitle">BUYBACK 操作ガイド</h1>'),
          ('First10はR3と同じ canonical source を使います。ここから開始・再開・リプレイを選び、業務データを変更せずに操作導線だけ確認できます。','最初の10項目を、開始・再開・もう一度見るから選んで確認できます。ガイドから業務データは変更しません。'),
          ('<small>TUTORIAL STATE</small>','<small>進行状況</small>'),
          ('aria-label="Tutorial controls"','aria-label="操作ガイドの操作"'),
          ('>Start / 最初から開始</button>','>最初から開始</button>'),
          ('>Resume / 続きから再開</button>','>続きから再開</button>'),
          ('>Replay / もう一度</button>','>もう一度見る</button>'),
          ('Guide CenterとFirst10はTutorial専用状態だけを扱います。','操作ガイドは案内用の進行状況だけを扱います。'),
          ('<small>FIRST10 / CANONICAL</small>','<small>はじめに</small>'),
          ('<h2>最初に覚える10ステップ</h2>','<h2>最初に覚える10項目</h2>'),
          ('順番・タイトル・ガイダンス・安全注意は <code>tutorial-first10.json</code> を直接読み込んで表示します。','順番・タイトル・案内・安全上の注意をまとめて表示します。'),
          ('aria-label="First10 steps"','aria-label="最初の10項目"'),
          ('<div class="loading">First10を読み込んでいます…</div>','<div class="loading">操作ガイドを読み込んでいます…</div>'),
          ('<small>MORE GUIDES / OUTSIDE FIRST10</small>','<small>追加ガイド</small>'),
          ('<h2>First10の外で確認できる案内</h2>','<h2>追加で確認できる案内</h2>'),
          ('以下はFirst10の10件には加算しません。必要なときだけ別途確認します。','以下は必要なときだけ個別に確認できます。'),
          ('aria-label="Additional guides"','aria-label="追加ガイド"'),
          ('First10の順序や件数には含めません。','最初の10項目とは別に確認できます。'),
          ('Guide Centerから参照するだけで、Product Site自体は変更しません。','操作ガイドから製品説明ページを参照できます。'),
          ('<div class="footer">DPRO BUYBACK TUTORIAL / R4 GUIDE CENTER</div>','<div class="footer">DPRO BUYBACK / 操作ガイド</div>'),
          ("if(s.completed)return 'First10 完了';","if(s.completed)return '操作ガイド完了';"),
          ("STEP ${String(s.step).padStart(2,'0')}","手順 ${String(s.step).padStart(2,'0')}"),
          ("throw new Error('Guide Center requires exactly 10 canonical First10 steps')","throw new Error('操作ガイドの10項目を確認できません')"),
          ('First10 load error: ','操作ガイド読込エラー：'),
          ('First10 HTTP ${r.status}','読込エラー ${r.status}')
          ]
          for a,b in repls: rep(a,b)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Static safety QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('guide-center.html').read_text(encoding='utf-8')
          for x in ['DPRO TUTORIAL STANDARD V1.1 / GUIDE CENTER','TUTORIAL STATE','FIRST10 / CANONICAL','MORE GUIDES / OUTSIDE FIRST10','>Start /','>Resume /','>Replay /','>STEP ${String(s.step)']:
              assert x not in s, x
          for x in ['最初から開始','続きから再開','もう一度見る','Owner PCへ戻る','手順 ${String(s.step)']:
              assert x in s, x
          assert "window.__DPRO_GUIDE_QA__" in s and "tutorial-first10.json" in s
          PY
          git diff --check

      - name: Commit forward-only fix
        shell: bash
        run: |
          git config user.name "DPRO CHAT B R2"
          git config user.email "actions@users.noreply.github.com"
          git rm ".github/workflows/dpro-chat-b-r2-public-guide-safety.yml"
          git add guide-center.html
          git commit -m "DPRO CHAT B R2: public guide and demo safety"
          git push
