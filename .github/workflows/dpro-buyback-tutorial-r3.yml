name: DPRO BUYBACK Tutorial R3 LIVE QA
on:
  push:
    branches: [main]
    paths:
      - 'tutorial.html'
      - 'tutorial-first10.json'
      - 'tutorial-qa.mjs'
      - '.github/workflows/dpro-buyback-tutorial-r3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages R3 V1.4
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "https://dpromstk2000-lab.github.io/dpro-buyback-line/tutorial.html?sha=${GITHUB_SHA}&n=${i}" | grep -q 'DPRO_TUTORIAL_R3_V1_4'; then exit 0; fi
            sleep 10
          done
          echo 'R3 Tutorial V1.4 marker did not appear on LIVE Pages' >&2
          exit 1
      - name: Run exact-width LIVE QA
        run: node tutorial-qa.mjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyback-r3-live-qa-${{ github.sha }}
          path: r3-live-qa.json
          if-no-files-found: warn
