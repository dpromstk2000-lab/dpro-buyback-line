<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DPRO BUYBACK First10 Tutorial</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#eef4f1;color:#14221f}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.mask{position:fixed;inset:0;pointer-events:none;z-index:2147483000}.highlight{position:fixed;border:3px solid #0d7b65;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,20,17,.18),0 0 0 5px rgba(255,255,255,.92);pointer-events:none;transition:.15s;display:none}
.card{position:fixed;z-index:2147483200;width:min(390px,calc(100vw - 20px));left:18px;top:18px;background:#fff;border:1px solid #c9d8d2;border-radius:18px;box-shadow:0 18px 50px rgba(8,63,52,.24);overflow:hidden}.drag{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;background:#083f34;color:#fff;cursor:grab;touch-action:none;user-select:none}.drag:active{cursor:grabbing}.brand{font-size:11px;font-weight:900;letter-spacing:.08em}.stepBadge{font-size:11px;font-weight:900;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:999px}.body{padding:14px 15px 12px}.title{margin:0;font-size:18px;line-height:1.35}.guide{margin:8px 0 0;font-size:13px;line-height:1.65;color:#4b5c57}.safe{margin:9px 0 0;padding:9px 10px;background:#f4f8f6;border-radius:10px;font-size:11px;line-height:1.5;color:#4f625c}.status{margin-top:8px;font-size:10px;color:#62736e}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 15px 14px}.actions button,.topActions button,#reopen{min-height:38px;border:1px solid #c8d8d2;border-radius:10px;background:#fff;color:#123b32;font-weight:800;cursor:pointer}.actions button.primary{background:#0d5c4b;color:#fff;border-color:#0d5c4b}.actions button:disabled{opacity:.38;cursor:not-allowed}.topActions{display:flex;gap:6px;padding:0 15px 10px;flex-wrap:wrap}.topActions button{min-height:32px;padding:5px 9px;font-size:11px}.actions button:focus-visible,.topActions button:focus-visible,#reopen:focus-visible,.drag:focus-visible{outline:3px solid #f0b43c;outline-offset:2px}.closed .card{display:none}#reopen{display:none;position:fixed;z-index:2147483300;right:12px;bottom:12px;padding:8px 12px;background:#083f34;color:#fff;border-color:#083f34}.closed #reopen{display:block}.complete .title:after{content:" ✓";color:#0d7b65}
@media(max-width:520px){.card{left:10px;top:10px;width:calc(100vw - 20px)}.actions{grid-template-columns:repeat(2,1fr)}.body{padding:12px}.title{font-size:16px}.guide{font-size:12px}}
</style></head><body data-version="DPRO_TUTORIAL_R3_V1_1">
<iframe id="appFrame" title="DPRO BUYBACK product screen"></iframe><div class="mask"><div id="dproTargetHighlight" class="highlight"></div></div>
<section id="tutorialCard" class="card" aria-label="First10 チュートリアル" role="dialog" aria-modal="false">
 <div id="dragHandle" class="drag" tabindex="0" aria-label="チュートリアルカードを移動"><span class="brand">DPRO FIRST10</span><span id="stepBadge" class="stepBadge">1 / 10</span></div>
 <div class="body"><h1 id="stepTitle" class="title"></h1><p id="stepGuide" class="guide"></p><div id="stepSafety" class="safe"></div><div id="targetStatus" class="status" aria-live="polite"></div></div>
 <div class="topActions"><button id="startBtn">Start</button><button id="resumeBtn">Resume</button><button id="replayBtn">Replay</button><button id="skipBtn">Skip</button><button id="closeBtn">Close / Esc</button></div>
 <div class="actions"><button id="backBtn">Back</button><button id="nextBtn" class="primary">Next</button></div>
</section><button id="reopen">Resume Tutorial</button>
<script>
(()=>{'use strict';
const STORAGE='dpro_tutorial_buyback_v1_1'; const POSITION='dpro_tutorial_buyback_card_v1_1';
const frame=document.getElementById('appFrame'), card=document.getElementById('tutorialCard'), hi=document.getElementById('dproTargetHighlight');
let model={steps:[]}, current=0, currentTarget=null, closed=false, completed=false;
const qs=id=>document.getElementById(id); const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{return {}}}
function saveState(extra={}){const prev=loadState();localStorage.setItem(STORAGE,JSON.stringify({...prev,step:current,completed,updatedAt:new Date().toISOString(),...extra}))}
function savePos(){localStorage.setItem(POSITION,JSON.stringify({left:card.offsetLeft,top:card.offsetTop}))}
function applyPos(){try{const p=JSON.parse(localStorage.getItem(POSITION)||'{}'); if(Number.isFinite(p.left))card.style.left=p.left+'px'; if(Number.isFinite(p.top))card.style.top=p.top+'px'}catch{} clampCard()}
function clampCard(){if(closed)return; const r=card.getBoundingClientRect(); const x=clamp(r.left,6,Math.max(6,innerWidth-r.width-6)); const y=clamp(r.top,6,Math.max(6,innerHeight-r.height-6)); card.style.left=x+'px';card.style.top=y+'px'; updateHighlight()}
function routeFor(step){const u=new URL(step.url);return u.pathname.split('/').pop()+u.search}
function sameRoute(step){try{const u=new URL(frame.src,location.href), t=new URL(step.url); return u.pathname.endsWith('/'+t.pathname.split('/').pop())&&u.search===t.search}catch{return false}}
function render(){const s=model.steps[current]; if(!s)return; completed=false; document.body.classList.remove('complete'); qs('stepBadge').textContent=`${current+1} / ${model.steps.length}`;qs('stepTitle').textContent=s.title;qs('stepGuide').textContent=s.guidance;qs('stepSafety').textContent=s.safety;qs('backBtn').disabled=current===0;qs('nextBtn').textContent=current===model.steps.length-1?'Complete':'Next';
 saveState(); if(!sameRoute(s)){frame.src=routeFor(s)}else locateTarget();}
function visible(el){if(!el)return false;const r=el.getBoundingClientRect(),cs=getComputedStyle(el);return r.width>0&&r.height>0&&cs.display!=='none'&&cs.visibility!=='hidden'}
function locateTarget(){const s=model.steps[current]; currentTarget=null; try{const d=frame.contentDocument; const primary=d.querySelector(s.target); const fallback=d.querySelector(s.fallback); currentTarget=visible(primary)?primary:(visible(fallback)?fallback:(primary||fallback)); const used=currentTarget===primary?'primary':(currentTarget===fallback?'fallback':'missing'); qs('targetStatus').textContent=currentTarget?`Target: ${used} ${currentTarget===primary?s.target:s.fallback}`:'Target: NOT FOUND';}catch(e){qs('targetStatus').textContent='Target: NOT AVAILABLE';} updateHighlight()}
function updateHighlight(){if(!currentTarget||!visible(currentTarget)){hi.style.display='none';return} const fr=frame.getBoundingClientRect(),r=currentTarget.getBoundingClientRect(),pad=5;hi.style.display='block';hi.style.left=(fr.left+r.left-pad)+'px';hi.style.top=(fr.top+r.top-pad)+'px';hi.style.width=(r.width+pad*2)+'px';hi.style.height=(r.height+pad*2)+'px'}
function go(i){current=clamp(i,0,model.steps.length-1);render()}
function next(){if(current===model.steps.length-1){completed=true;saveState({completed:true});document.body.classList.add('complete');qs('stepTitle').textContent='First10 完了';qs('stepGuide').textContent='チュートリアル状態だけを完了しました。業務データは変更していません。';hi.style.display='none';return}go(current+1)}
function back(){if(current>0)go(current-1)}
function close(){closed=true;document.body.classList.add('closed');hi.style.display='none';saveState({closed:true})}
function reopen(){closed=false;document.body.classList.remove('closed');saveState({closed:false});locateTarget();qs('nextBtn').focus()}
function replay(){localStorage.removeItem(STORAGE);current=0;completed=false;reopen();render()}
function resume(){const s=loadState();current=clamp(Number(s.step)||0,0,model.steps.length-1);reopen();render()}
function skip(){completed=true;saveState({completed:true,skipped:true});document.body.classList.add('complete');qs('stepTitle').textContent='First10 をスキップしました';qs('stepGuide').textContent='Tutorial状態だけを更新しました。業務データは変更していません。';hi.style.display='none'}
qs('startBtn').onclick=()=>go(0);qs('resumeBtn').onclick=resume;qs('replayBtn').onclick=replay;qs('skipBtn').onclick=skip;qs('closeBtn').onclick=close;qs('reopen').onclick=reopen;qs('backBtn').onclick=back;qs('nextBtn').onclick=next;
frame.addEventListener('load',()=>{setTimeout(locateTarget,120);setTimeout(locateTarget,700)});addEventListener('resize',clampCard);frame.addEventListener('load',()=>{try{frame.contentWindow.addEventListener('scroll',updateHighlight,{passive:true})}catch{}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!closed){e.preventDefault();close()}});
let drag=null; const handle=qs('dragHandle');handle.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0&&e.pointerType!=='touch')return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:card.offsetLeft,top:card.offsetTop};handle.setPointerCapture?.(e.pointerId);e.preventDefault()});handle.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;card.style.left=(drag.left+e.clientX-drag.x)+'px';card.style.top=(drag.top+e.clientY-drag.y)+'px';clampCard()});handle.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id){drag=null;clampCard();savePos()}});handle.addEventListener('pointercancel',()=>{drag=null;clampCard()});
fetch('tutorial-first10.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.exactStepCount!==10||j.steps.length!==10)throw new Error('First10 contract must be exactly 10');model=j; const s=loadState();current=clamp(Number(s.step)||0,0,9);applyPos();render(); if(s.closed)close();}).catch(e=>{qs('stepTitle').textContent='Tutorial load error';qs('stepGuide').textContent=String(e);console.error(e)});
window.__DPRO_TUTORIAL_QA__={version:'DPRO_TUTORIAL_R3_V1_1',get stepCount(){return model.steps.length},get current(){return current},get targetFound(){return !!currentTarget},get targetRect(){return currentTarget?currentTarget.getBoundingClientRect():null},get cardRect(){const r=card.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}},goTo:i=>go(i),next,back,close,reopen,replay,resume,skip,clampCard,get state(){return loadState()}};
})();
</script></body></html>
